[package]
name = "makapix-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "mkpx — the Tier-1 headless harness for the Makapix engine."

[[bin]]
name = "mkpx"
path = "src/main.rs"

[dependencies]
makapix-engine = { path = "../engine" }
makapix-scene = { path = "../scene" }
# Lab-only: the `import` subcommand drives the same decode path the app's mkpx_import uses
# (memory-audit tooling, 2026-07-29). The shipping FFI already links codec on every platform,
# so this adds nothing to any product artifact.
makapix-codec = { path = "../codec" }
