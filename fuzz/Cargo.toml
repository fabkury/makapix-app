[package]
name = "makapix-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.makapix-engine]
path = "../crates/engine"

[dependencies.makapix-codec]
path = "../crates/codec"

# libwebp — Google's C reference implementation, vendored and statically linked — as the
# INDEPENDENT decoder for the animated-WebP differential. Our muxer is hand-written pure
# Rust, so checking it against the reference decoder is a genuine two-implementation
# comparison rather than a round-trip through our own code. This is fuzz-only dev tooling
# (the engine's no-native-crates rule guards the shipped cross-compiled build, which this
# never enters).
[dependencies.webp-animation]
version = "0.10"
default-features = false
features = ["static"]

[[bin]]
name = "fuzz_load_mkpx"
path = "fuzz_targets/fuzz_load_mkpx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_session_actions"
path = "fuzz_targets/fuzz_session_actions.rs"
test = false
doc = false
bench = false

# Seed-corpus generator; a plain binary, run with `cargo run --release --bin make_seeds`
# from this directory (NOT through `cargo fuzz`).
[[bin]]
name = "fuzz_webp_differential"
path = "fuzz_targets/fuzz_webp_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_codec_import"
path = "fuzz_targets/fuzz_codec_import.rs"
test = false
doc = false
bench = false

# Verifies the differential oracle itself (positive + negative); run by hand, not fuzzed.
[[bin]]
name = "webp_check"
path = "src/bin/webp_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "make_seeds"
path = "src/bin/make_seeds.rs"
test = false
doc = false
bench = false

# Detached from the root workspace on purpose: the workspace ships panic = "abort",
# but libFuzzer must observe panics through its own handler, and the fuzz build wants
# overflow checks (integer exactness is engine doctrine — a silent wraparound is a bug).
[workspace]

[profile.release]
debug = 1
overflow-checks = true
# Make `debug_assert!` invariants live oracles while fuzzing — e.g. the stale-selection
# guard in `io::save_to_bytes` (fuzz FZ-2) aborts with a named message instead of the
# fuzzer having to notice an 18-byte difference downstream.
debug-assertions = true
